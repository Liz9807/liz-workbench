<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f6">
<title>清晰工作台</title>
<style>
:root{
  --bg:#faf9f6; --card:#ffffff; --ink:#1a1a1a; --sub:#8a8a85; --faint:#c9c7c0;
  --line:#eceae4; --fill:#f5f4f0; --inv:#1a1a1a;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:28px 22px 60px}

/* 头 */
.head-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
header .app{font-size:11px;letter-spacing:2.5px;color:var(--faint);text-transform:uppercase}
header .date{font-size:12px;color:var(--faint);font-weight:400}
.time-hero{margin:0;display:flex;align-items:flex-end;gap:14px}
.time-hero .big{font-size:44px;font-weight:600;letter-spacing:.5px;line-height:1.05;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.time-side{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding-bottom:2px}
.time-side .greet{font-size:10.5px;color:var(--sub);letter-spacing:.3px;line-height:1.4;white-space:nowrap}
.time-side .remain{font-size:10.5px;color:var(--sub);letter-spacing:.3px;line-height:1.4;white-space:nowrap}
.day-bar{height:2px;background:var(--fill);border-radius:2px;margin-top:16px;overflow:hidden}
.day-bar-fill{height:100%;background:var(--ink);width:0%;border-radius:3px;transition:width 1s ease}
.motto{font-size:13px;color:var(--sub);font-style:italic;letter-spacing:.5px;margin:20px 0 26px;border:0;background:none;padding:0;font-family:inherit;cursor:pointer;display:block;text-align:left}
.motto:hover{color:var(--ink)}
.motto:hover{color:var(--ink)}

/* 区 */
.sec{background:var(--card);border-radius:var(--radius);padding:22px 20px 20px;margin-bottom:14px;
  border:1px solid var(--line)}
.sec-title{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);font-weight:600;
  letter-spacing:.5px;margin-bottom:10px}
.sec-title b{color:var(--ink);font-weight:600}
.sec-title .side{margin-left:auto;font-size:11px;color:var(--faint);letter-spacing:0;font-weight:400}
.hint{font-size:12px;color:var(--sub);line-height:1.85;margin:0 0 14px}
.empty-state{margin:0 0 14px;font-size:12.5px;color:var(--sub);line-height:1.85}
.guide{font-size:12.5px;color:var(--sub);line-height:1.85;margin:0 0 12px}
.guide br{content:'';display:block;margin-top:4px}
.hint b{color:var(--ink);font-weight:500}

/* 今日一件 */
.today-hero{font-size:26px;font-weight:600;letter-spacing:.5px;line-height:1.4;margin-bottom:6px}
.today-empty{color:var(--sub);font-size:13.5px;padding:6px 0 2px;line-height:1.7}
.today-hero.muted{font-size:20px;color:var(--faint);font-weight:500}
.today-meta{margin-top:10px;font-size:13px;color:var(--sub)}
.today-sub{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--faint);margin-top:2px}

.steps{display:flex;flex-direction:column;gap:9px;margin:14px 0 6px}
.step{display:flex;align-items:center;gap:10px}
.step .num{font-size:13px;color:var(--faint);width:14px}
.step input{flex:1}
input[type=text],textarea{font-family:inherit;font-size:14px;color:var(--ink);border:0;
  border-bottom:1px solid var(--line);background:transparent;padding:6px 0;outline:none;border-radius:0}
input:focus,textarea:focus{border-bottom-color:var(--ink)}
textarea{resize:none;width:100%;line-height:1.7}
::placeholder{color:var(--faint)}
input[type=time]{font-family:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);
  background:var(--fill);padding:7px 10px;border-radius:8px;outline:none}

.btn-row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
button{font-family:inherit;border:0;border-radius:999px;cursor:pointer;font-size:14px;
  padding:9px 18px;background:var(--fill);color:var(--ink);transition:opacity .15s;letter-spacing:.3px}
button:active{opacity:.6}
button.primary{background:var(--ink);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
button.link{background:none;padding:4px;font-size:12px;color:var(--sub);text-decoration:underline}

.countdown{margin-top:14px;padding:12px 14px;background:var(--fill);border-radius:10px;
  font-size:15px;display:none}
.countdown.on{display:block}
.countdown .big{font-size:24px;font-weight:600;letter-spacing:1px}
.done-wrap{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.done-wrap input{width:18px;height:18px;accent-color:var(--ink);cursor:pointer}
.done-wrap.done{color:var(--sub);text-decoration:line-through}
.done-wrap .yes{color:var(--ink);text-decoration:none;font-weight:500}

/* 反馈 */
#feedbackInput{height:46px;border:1px solid var(--line);background:var(--fill);border-radius:10px;
  padding:10px 12px;font-size:14px}
.feed-empty{margin:14px 0 4px;font-size:12px;color:var(--sub);line-height:1.7}
#feedList{margin-top:16px}
.feed-item{padding:12px 0;border-bottom:1px dashed var(--line);font-size:13.5px;color:var(--sub)}
.feed-item:last-child{border-bottom:0}
.feed-item .d{font-size:11px;color:var(--faint);margin-bottom:2px}
.feed-item .t{color:var(--ink)}

/* 清单 */
.item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .no{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;line-height:1.6}
.item .txt{flex:1;min-width:0}
.item .name{font-size:15px}
.item .why{font-size:12px;color:var(--faint);margin-top:1px}
.item button.act{background:none;border:0;color:var(--sub);font-size:12px;text-decoration:underline;
  cursor:pointer;padding:2px;white-space:nowrap;line-height:1.8}
.item button.del{background:none;border:0;color:var(--faint);font-size:16px;cursor:pointer;padding:0 2px;line-height:1}
.item button.del:active{color:var(--ink)}

.add{display:flex;gap:10px;align-items:center;margin-top:6px}
.add input{flex:1}
.add button{background:none;border:0;color:var(--ink);font-size:24px;cursor:pointer;padding:0 6px 4px;line-height:1;opacity:.45}
.add button:active{opacity:1}
.badge{font-size:11px;color:var(--faint);letter-spacing:1px}

.footer{text-align:center;color:var(--faint);font-size:11px;margin-top:34px;letter-spacing:1px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
#exportOut{white-space:pre-wrap;font-size:12px;color:var(--sub);background:var(--fill);
  border-radius:10px;padding:12px;margin-top:12px;max-height:260px;overflow:auto;display:none}

/* 密码锁 */
#lockScreen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:24px}
#lockScreen .lock-box{width:100%;max-width:340px;text-align:center}
#lockScreen .lock-title{font-size:18px;font-weight:600;letter-spacing:1px;color:var(--ink);margin-bottom:8px}
#lockScreen .lock-sub{font-size:12px;color:var(--faint);margin-bottom:26px;line-height:1.7}
#lockScreen input{width:100%;text-align:center;font-size:20px;letter-spacing:8px;padding:12px;
  border:1px solid var(--line);background:var(--card);border-radius:12px;outline:none;color:var(--ink)}
#lockScreen input:focus{border-color:var(--ink)}
#lockScreen .lock-err{font-size:12px;color:#a32d2d;margin-top:10px;min-height:18px}
#lockScreen .lock-btn{width:100%;margin-top:8px;background:var(--ink);color:#fff;border-radius:12px;
  font-size:14px;padding:12px;letter-spacing:2px}
.lock-hint{font-size:11px;color:var(--faint);margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div id="lockScreen" style="display:none">
  <div class="lock-box">
    <div class="lock-title">清晰工作台</div>
    <div class="lock-sub" id="lockSub">这是你的私人空间</div>
    <input type="password" id="lockInput" placeholder="••••" autocomplete="current-password">
    <div class="lock-err" id="lockErr"></div>
    <button class="lock-btn" id="lockBtn">进入</button>
    <div class="lock-hint" id="lockHint"></div>
  </div>
</div>
<div class="wrap">

  <header>
    <div class="head-top">
      <span class="app">清晰工作台</span>
      <span class="date" id="todayLabel"></span>
    </div>
    <div class="time-hero">
      <span id="clock" class="big">--:--</span>
      <span class="time-side"><span class="greet" id="greet">新的一天，不急，慢慢来</span><span class="remain" id="dayProgress">今天还剩 0 小时 0 分</span></span>
    </div>
    <div class="day-bar"><div class="day-bar-fill" id="dayBar"></div></div>
    <button class="motto" id="motto" title="点一下可以改这句话">"我无限地爱着新的一日。"</button>
  </header>

  <!-- 今日一件 -->
  <section class="sec">
    <div class="sec-title"><b>今日一件</b><span class="side">从 A 里挑一件，只做这一件</span></div>
    <div id="todayEmpty" class="today-empty">今天还没定。<br>往下到 A 清单，点某一件右侧的"做它"。</div>
    <div id="todayBody" style="display:none">
      <div class="today-hero" id="todayAction"></div>
      <div class="steps">
        <div class="step"><span class="num">1</span><input type="text" id="s1" placeholder="第一步（2 分钟内能启动）" onchange="saveTodayNotes()"></div>
        <div class="step"><span class="num">2</span><input type="text" id="s2" placeholder="第二步" onchange="saveTodayNotes()"></div>
        <div class="step"><span class="num">3</span><input type="text" id="s3" placeholder="第三步（可选）" onchange="saveTodayNotes()"></div>
      </div>
      <div class="btn-row">
        <span class="hint" style="margin:0;flex:1">打算几点前做完？（可选）</span>
        <input type="time" id="deadline" style="margin-right:2px" onchange="saveTodayNotes()">
        <button class="link" onclick="changeToday()">换一件</button>
      </div>
      <label class="done-wrap" id="doneWrap">
        <input type="checkbox" id="doneChk" onchange="toggleDone()">
        <span id="doneLabel">做完了，去写一行反馈</span>
      </label>
    </div>
  </section>

  <!-- 反馈一行 -->
  <section class="sec">
    <div class="sec-title"><b>反馈一行</b><span class="side">做了 X · 结果 Y · 感受 Z</span></div>
    <textarea id="feedbackInput" placeholder="例：改完一版方案，被认可，心里定了。"></textarea>
    <div class="btn-row"><button class="primary" onclick="saveFeedback()" style="padding:8px 18px">记下</button></div>
    <div id="feedList" style="margin-top:10px"></div>
  </section>

  <!-- A 主轴 -->
  <section class="sec">
    <div class="sec-title"><b>A 主轴</b><span class="side">最多 5 件 · 每天从这挑</span></div>
    <p class="hint">圈出你真正想推进的事。每件补一句"图的是什么"，写不出真话的，降级进 B。</p>
    <div id="aList"></div>
    <div class="add">
      <input type="text" id="aInput" placeholder="写下一件…">
      <button onclick="addA()" title="加入">＋</button>
    </div>
  </section>

  <!-- B 清单 -->
  <section class="sec">
    <div class="sec-title"><b>不关注清单</b><span class="side">丢进来 = 安心放下</span></div>
    <p class="hint">收藏前先问："我具体会在哪天、哪件事上用？"答不出 → 丢进来。</p>
    <div id="bList"></div>
    <div class="add">
      <input type="text" id="bInput" placeholder="放下一件现在不该管的…">
      <button onclick="addB()" title="放下">＋</button>
    </div>
  </section>

  <!-- 导出 -->
  <section class="sec">
    <div class="sec-title"><b>备份 / 导出</b><span class="side">每周日一次</span></div>
    <div class="btn-row">
      <button onclick="exportMarkdown()">导出本周反馈</button>
      <button class="ghost" onclick="backupJSON()">完整备份</button>
    </div>
    <div id="exportOut"></div>
  </section>

  <div class="footer">先跑两周 · 数据只存本机</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
var KEY='liz-workbench-v1';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayCn(){var wd=['日','一','二','三','四','五','六'];var d=new Date();
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' 周'+wd[d.getDay()]}
var store={a:[],b:[],today:{},history:{},motto:''};
var storageFail=false,storageWarned=false;
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);
  store.a=o.a||[];store.b=o.b||[];store.today=o.today||{};store.history=o.history||{};store.motto=o.motto||''}}catch(e){storageFail=true}}
function save(){
  if(storageFail){warnStorage();return}
  try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){
    storageFail=true;warnStorage()}
}
function warnStorage(){
  if(storageWarned)return;storageWarned=true;
  setTimeout(function(){toast('此预览环境无法本地存储，数据仅本次有效；正式部署后即可保存')},400)
}
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},1800)}

/* motto */
function getGreeting(){
  var h=new Date().getHours();
  if(h>=5&&h<11)return '新的一天，不急，慢慢来';
  if(h>=11&&h<17)return '午后安安静静，正好做那件惦记的事';
  if(h>=17&&h<21)return '忙了一整天了，剩下的可以慢一点';
  return '今天辛苦了，早点休息';
}
function startClock(){
  function tick(){
    var n=new Date();
    var pad=function(x){return ('0'+x).slice(-2)};
    document.getElementById('clock').textContent=pad(n.getHours())+':'+pad(n.getMinutes());
    document.getElementById('greet').textContent=getGreeting();
    var passed=n.getHours()*60+n.getMinutes();
    var pct=(passed/(24*60)*100).toFixed(1);
    document.getElementById('dayBar').style.width=pct+'%';
    var left=24*60-passed;
    var lH=Math.floor(left/60),lM=left%60;
    document.getElementById('dayProgress').textContent='今天还剩 '+lH+' 小时 '+lM+' 分'
  }
  tick();setInterval(tick,15000)
}
function initMotto(){
  var m=document.getElementById('motto');
  if(store.motto) m.textContent='"'+store.motto+'。"';
  m.onclick=function(){var v=prompt('你的座右铭（显示在顶部）：',store.motto||'我无限地爱着新的一日');
    if(v!==null&&v.trim()){store.motto=v.trim();m.textContent='"'+store.motto+'。"';save()}}
}

/* A */
function renderA(){
  var el=document.getElementById('aList'),h='';
  store.a.forEach(function(it,i){
    h+='<div class="item"><span class="no">'+(i+1)+'</span><div class="txt"><div class="name">'+esc(it.t)+'</div>'+
      (it.why?'<div class="why">图的是：'+esc(it.why)+'</div>':'')+'</div>'+
      '<button class="act" onclick="pickA('+i+')">做它</button>'+
      '<button class="del" onclick="delA('+i+')">×</button></div>';
  });
  el.innerHTML=h||'<p class="empty-state">还没有 A。能写出一件就够了。</p>';
  var add=document.querySelector('#aList').parentNode.querySelector('.add');
  if(add)add.style.display=store.a.length>=5?'none':'flex';
}

/* B */
function renderB(){
  var el=document.getElementById('bList'),h='';
  store.b.forEach(function(it,i){
    h+='<div class="item"><span class="no">·</span><div class="txt"><div class="name">'+esc(it)+'</div></div>'+
      '<button class="act" onclick="reviveB('+i+')">转正</button>'+
      '<button class="del" onclick="delB('+i+')">×</button></div>';
  });
  el.innerHTML=h||'<p class="empty-state">还没有放下的东西。想到一件现在不该管的，丢进来。</p>';
}

/* today */
function renderToday(){
  var t=store.today,d=today();
  if(!t.date||t.date!==d){store.today={date:d,item:null,steps:['','',''],deadline:'',done:false};save()}
  t=store.today;
  var empty=document.getElementById('todayEmpty'),body=document.getElementById('todayBody');
  if(!t.item){empty.style.display='block';body.style.display='none';return}
  empty.style.display='none';body.style.display='block';
  document.getElementById('todayAction').textContent=t.item.t;
  document.getElementById('s1').value=t.steps[0]||'';document.getElementById('s2').value=t.steps[1]||'';
  document.getElementById('s3').value=t.steps[2]||'';document.getElementById('deadline').value=t.deadline||'';
  var done=document.getElementById('doneWrap');
  done.classList.toggle('done',!!t.done);
  var lb=document.getElementById('doneLabel');
  lb.innerHTML=t.done?'<span class="yes">已完成</span> · 记得去写反馈':'做完了，去写一行反馈';
  document.getElementById('doneChk').checked=!!t.done;
}
function pickA(i){
  var it=store.a[i];
  store.today={date:today(),item:{t:it.t},steps:['','',''],deadline:'',done:false};
  save();renderToday();window.scrollTo({top:0,behavior:'smooth'});
  toast('已定为今日一件');
}
function changeToday(){store.today.item=null;save();renderToday()}
function saveTodayNotes(){
  var t=store.today;if(!t)return;
  t.steps=[document.getElementById('s1').value,document.getElementById('s2').value,document.getElementById('s3').value];
  t.deadline=document.getElementById('deadline').value;save()
}
function toggleDone(){
  var t=store.today;t.done=document.getElementById('doneChk').checked;save();renderToday();
  if(t.done){toast('收工。写一行反馈吧');var f=document.getElementById('feedbackInput');
    setTimeout(function(){f.focus();f.scrollIntoView({behavior:'smooth'})},250)}
}

/* feed */
function renderFeed(){
  var ks=Object.keys(store.history).sort().reverse().slice(0,12),h='';
  ks.forEach(function(k){var f=store.history[k];
    h+='<div class="feed-item"><div class="d">'+esc(f.date)+' · '+esc(f.action||'')+'</div><div class="t">'+esc(f.doing)+(f.feeling?' · '+esc(f.feeling):'')+'</div></div>'});
  document.getElementById('feedList').innerHTML=h||'<p class="feed-empty">完成第一件后，这里会出现第一行。</p>';
}
function saveFeedback(){
  var v=document.getElementById('feedbackInput').value.trim();if(!v)return;
  var t=store.today;
  var parts=v.split(/[·・]/);
  store.history[today()+'-'+uid()]={date:today(),action:(t&&t.item)?t.item.t:'',
    doing:parts[0].trim(),feeling:parts.slice(1).join('·').trim()};
  save();document.getElementById('feedbackInput').value='';renderFeed();toast('已记下 — 你的说明书原料')
}

/* add/remove */
function addA(){
  var i=document.getElementById('aInput'),t=i.value.trim();
  if(!t)return;
  if(store.a.length>=5){toast('A 最多 5 件，想换先移除一件');return}
  var why=prompt('它图什么？（一句话真话，可跳过）')||'';
  store.a.push({t:t,why:why});i.value='';save();renderA()
}
function delA(i){store.a.splice(i,1);save();renderA()}
function addB(){
  var i=document.getElementById('bInput'),t=i.value.trim();if(!t)return;
  store.b.push(t);i.value='';save();renderB();toast('放下了')
}
function delB(i){store.b.splice(i,1);save();renderB()}
function reviveB(i){
  var t=store.b[i];
  if(store.a.length>=5){toast('A 已满，先移除一件 A');return}
  store.b.splice(i,1);
  var why=prompt('它图什么？')||'';store.a.push({t:t,why:why});save();renderA();renderB();toast('已转正进 A')
}

/* export */
function weekOf(d){var x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);
  var y=x.getFullYear();var w=Math.ceil((((x-new Date(y,0,1))/86400000)+x.getDay()+1)/7);
  return y+' 第'+w+'周'}
function exportMarkdown(){
  var now=new Date(),wk=weekOf(now);
  var ks=Object.keys(store.history).filter(function(k){return weekOf(new Date(store.history[k].date))===wk}).sort();
  var L=['# 反馈 · '+wk,'','> 来源：清晰工作台',''];
  ks.forEach(function(k){var f=store.history[k];
    L.push('## '+f.date+' · '+(f.action||'一件小事'));L.push('- '+f.doing);
    if(f.feeling)L.push('- 感受：'+f.feeling);L.push('')});
  if(!ks.length)L.push('（本周还没有反馈）');
  var txt=L.join('\n'),box=document.getElementById('exportOut');
  box.textContent=txt;box.style.display='block';
  copyText(txt)
}
function backupJSON(){
  var b=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='工作台备份-'+today()+'.json';a.click()
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast('已复制，可直接粘贴保存')},function(){})
  }else{var x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();
    try{document.execCommand('copy')}catch(e){}document.body.removeChild(x)}
}

window.addA=addA;window.delA=delA;window.addB=addB;window.delB=delB;
window.reviveB=reviveB;window.pickA=pickA;window.changeToday=changeToday;
window.saveTodayNotes=saveTodayNotes;window.toggleDone=toggleDone;
window.saveFeedback=saveFeedback;window.exportMarkdown=exportMarkdown;window.backupJSON=backupJSON;

/* ---- 密码锁 ---- */
var LOCK_KEY='liz-workbench-lock';
function lockHash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}
  return 'l'+h.toString(36)+'_'+s.length.toString(36)}
function lockRead(){try{return localStorage.getItem(LOCK_KEY)}catch(e){return undefined}}
function initAll(){
  document.getElementById('todayLabel').textContent=todayCn();
  startClock();initMotto();renderA();renderB();renderToday();renderFeed();
}
function setupFirstLock(){
  var sc=document.getElementById('lockScreen');
  if(lockRead()!==undefined&&lockRead()!==null){showUnlock();return}
  if(storageFail){sc.style.display='none';initAll();return} /* 预览环境无存储 → 不锁 */
  sc.style.display='flex';
  var sub=document.getElementById('lockSub'),btn=document.getElementById('lockBtn'),
      inp=document.getElementById('lockInput'),err=document.getElementById('lockErr'),
      hint=document.getElementById('lockHint');
  var temp='',step=1;
  function renderStep(){
    inp.value='';err.textContent='';
    if(step===1){sub.textContent='欢迎使用，先设一个密码';btn.textContent='下一步';
      hint.textContent='之后每次打开都需要它，请记好'}
    else{sub.textContent='再输入一次，确认密码';btn.textContent='完成';
      hint.textContent='两次一致才生效'}
  }
  renderStep();inp.focus();
  btn.onclick=function(){
    var v=inp.value;
    if(!v){err.textContent='先输入密码';return}
    if(step===1){temp=v;step=2;renderStep()}
    else{
      if(v!==temp){err.textContent='两次不一致，重新来';step=1;temp='';renderStep();return}
      try{localStorage.setItem(LOCK_KEY,lockHash(v))}catch(e){}
      sc.style.display='none';initAll();toast('密码已设置')
    }
  };
  inp.onkeydown=function(e){if(e.key==='Enter')btn.click()};
}
function showUnlock(){
  var sc=document.getElementById('lockScreen');
  if(storageFail||lockRead()===null||lockRead()===undefined){sc.style.display='none';initAll();return}
  sc.style.display='flex';
  var sub=document.getElementById('lockSub'),btn=document.getElementById('lockBtn'),
      inp=document.getElementById('lockInput'),err=document.getElementById('lockErr'),
      hint=document.getElementById('lockHint');
  inp.value='';err.textContent='';
  sub.textContent='输入密码，进入你的空间';btn.textContent='进入';
  hint.textContent='你的数据只存在这台设备的浏览器里';
  inp.focus();
  function go(){
    var v=inp.value;
    if(!v){err.textContent='请输入密码';return}
    if(lockRead()===lockHash(v)){sc.style.display='none';initAll()}
    else{err.textContent='密码不对，再试一次';inp.value='';inp.focus()}
  }
  btn.onclick=go;
  inp.onkeydown=function(e){if(e.key==='Enter')go()};
}
/* 入口 */
load();
if(lockRead()===null||lockRead()===undefined){setupFirstLock()}
else{showUnlock()}


})();
